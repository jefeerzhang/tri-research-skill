name: python-package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: lint (ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install 'ruff==0.15.1'

      - name: ruff (E + F, scoped)
        run: |
          ruff check --config .ruff.toml \
            skills/tri-research/scripts \
            skills/tri-research/tests \
            skills/serpapi/scripts

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: markdownlint (with relaxed config)
        run: |
          markdownlint-cli2 "**/*.md" \
            "#node_modules" "#.git" "#.venv" "#__pycache__"

  test:
    name: unittest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Git Bash on windows-latest too: the smoke/gate steps rely on POSIX syntax.
    defaults:
      run:
        shell: bash
    # Windows runners default their console/pipe encoding to cp1252, which
    # cannot encode the Chinese test names / report paths used throughout
    # this suite — unittest would die with UnicodeEncodeError while merely
    # printing. Force UTF-8 for both this process and spawned children.
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run state-machine unit tests
        run: |
          python -m unittest discover -s skills/tri-research/tests -v
          python -m unittest discover -s skills/serpapi/tests -v

      - name: "Smoke: state_machine.sh wrapper"
        run: |
          bash skills/tri-research/scripts/state_machine.sh --help

      - name: "Smoke: validate_report.py --help"
        run: |
          python skills/tri-research/scripts/validate_report.py --help
